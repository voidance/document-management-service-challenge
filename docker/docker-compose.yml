services:
  postgresql:
    container_name: postgresql_container
    image: bitnami/postgresql:15.4.0

    ports:
      - "5432:5432"
    networks:
      - batch_network
    volumes:
      - challenge_postgresql_data:/bitnami/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d
    env_file:
      - .env
    environment:
      - POSTGRESQL_USERNAME=${POSTGRESQL_USERNAME}
      - POSTGRESQL_PASSWORD=${POSTGRESQL_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRESQL_DATABASE}
      - POSTGRESQL_POSTGRES_PASSWORD=${POSTGRESQL_POSTGRES_PASSWORD} # Password of user "postgres"

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    networks:
      - batch_network
    ports:
      - "9000:9000"  # API S3
      - "9001:9001"  # MinIO Web Console
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    command: server --console-address ":9001" /data
    volumes:
      - challenge_minio_data:/data

  createbuckets:
    image:  minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    networks:
      - batch_network
    environment:
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until (mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} 2>/dev/null) do echo '...' && sleep 1; done;
      mc mb --ignore-existing myminio/${MINIO_BUCKET};
      mc anonymous set public myminio/${MINIO_BUCKET};
      exit 0;
      "

  document-management-service:
      image: document-management-service/document-management-service-app:0.0.1-SNAPSHOT
      environment:
        - JAVA_OPTS=-Xmx80m -Xms80m
        - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
        - POSTGRESQL_USERNAME=${POSTGRESQL_USERNAME}
        - POSTGRESQL_PASSWORD=${POSTGRESQL_PASSWORD}
        - POSTGRESQL_DATABASE=${POSTGRESQL_DATABASE}
        - MINIO_HOST=${MINIO_HOST}
        - MINIO_PORT=${MINIO_PORT}
        - MINIO_ROOT_USER=${MINIO_ROOT_USER}
        - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
        - MINIO_BUCKET=${MINIO_BUCKET}
        - DB_HOST=${DB_HOST}
      networks:
        - batch_network
      env_file:
        - .env
      depends_on:
        - postgresql
        - minio
      ports:
        - "8080:8080"
      profiles: ["with-document-management-service"]

volumes:
  challenge_postgresql_data:
    driver: local
  challenge_minio_data:
    driver: local

networks:
  batch_network:
    driver: bridge