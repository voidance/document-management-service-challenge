spring:
  mvc:
    format:
      content-type: application/json
    default-content-type: application/json

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRESQL_DATABASE}
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        # format_sql: true
        default_schema: document_schema

  flyway:
    default-schema: document_schema
    schemas: document_schema
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 501MB
      file-size-threshold: 1MB
      enabled: true


resilience4j.bulkhead:
  instances:
    uploadBulkhead:
      maxConcurrentCalls: 10
      maxWaitDuration: 0


minio:
  url: http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket: ${MINIO_BUCKET}
  # Tested max concurrent uploads without Minio raising a RuntimeException
  upload:
    max-concurrent: 1

server:
  port: ${SERVER_PORT:8080}
  error:
    include-exception: false
    include-stacktrace: never
    include-message: always


logging:
  level:
    org.springframework.web: INFO
    com.clara: DEBUG
